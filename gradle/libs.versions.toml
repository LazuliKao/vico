[versions]
activity = "1.9.3"
agp = "8.5.2"
androidXAnnotation = "1.8.0-KBA-001"
compose = "1.6.1-KBA-007"
composeSample = "1.6.1-KBA-007"
composeMaterial3 = "1.6.1-KBA-007"
composeMaterial3Expressive = "1.6.1-KBA-007"
composeMaterialIcons = "1.6.11"
composeNavigation = "2.8.0-alpha10"
coroutines = "1.8.0-KBA-001"
dateTime = "0.6.0"
dokka = "1.9.20"
glance = "1.1.1"
jetpackComposeBom = "2024.09.00"
kotlin = "2.0.21-KBA-013"
lifecycleRuntime = "2.8.4"
material = "1.12.0"
mavenPublish = "0.29.0"
mockK = "1.13.11"
screenshot = "0.0.1-alpha15"
uiTextAndroid = "1.6.3"

[libraries]
activityCompose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidApplication = { group = "com.android.application", name = "com.android.application.gradle.plugin", version.ref = "agp" }
androidLibrary = { group = "com.android.library", name = "com.android.library.gradle.plugin", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { group = "com.android.kotlin.multiplatform.library", name = "com.android.kotlin.multiplatform.library.gradle.plugin", version.ref = "agp" }
androidXAnnotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidXAnnotation" }
composeCompiler = { group = "org.jetbrains.kotlin.plugin.compose", name = "org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
composeDesktop = { group = "org.jetbrains.compose.desktop", name = "desktop-jvm", version.ref = "compose" }
composeFoundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
composeMaterial = { group = "org.jetbrains.compose.material", name = "material", version.ref = "compose" }
composeMaterial3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
composeMaterial3Expressive = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3Expressive" }
composeMaterialIcons = { group = "org.jetbrains.compose.material", name = "material-icons-core", version.ref = "composeMaterialIcons" }
composeMultiplatform = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "compose" }
composeNavigation = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "composeNavigation" }
composeRuntime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose" }
composeUI = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose" }
composeUITooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "compose" }
composeUIToolingPreview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
coroutinesCore = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
dokka = { group = "org.jetbrains.dokka", name = "dokka-gradle-plugin", version.ref = "dokka" }
glanceAppWidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
jetpackComposeBom = { group = "androidx.compose", name = "compose-bom", version.ref = "jetpackComposeBom" }
jetpackComposeUI = { group = "androidx.compose.ui", name = "ui" }
jetpackComposeUITooling = { group = "androidx.compose.ui", name = "ui-tooling" }
kotlinAndroid = { group = "org.jetbrains.kotlin.android", name = "org.jetbrains.kotlin.android.gradle.plugin", version.ref = "kotlin" }
kotlinDateTime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "dateTime" }
kotlinJvm = { group = "org.jetbrains.kotlin.jvm", name = "org.jetbrains.kotlin.jvm.gradle.plugin", version.ref = "kotlin" }
kotlinStdLib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinTest = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinTestJunit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
lifecycleRuntime = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
mavenPublish = { group = "com.vanniktech.maven.publish", name = "com.vanniktech.maven.publish.gradle.plugin", version.ref = "mavenPublish" }
mockK = { group = "io.mockk", name = "mockk", version.ref = "mockK" }
screenshotValidationApi = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshot" }
serialization = { group = "org.jetbrains.kotlin.plugin.serialization", name = "org.jetbrains.kotlin.plugin.serialization.gradle.plugin", version.ref = "kotlin" }
uiTextAndroid = { group = "androidx.compose.ui", name = "ui-text-android", version.ref = "uiTextAndroid" }

[plugins]
# `org.jetbrains.compose` is applied per module rather than shared through buildSrc, so the
# library and the sample can track different Compose versions (see the `compose` /
# `composeSample` versions above).
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeMultiplatformSample = { id = "org.jetbrains.compose", version.ref = "composeSample" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
